name: CI

on:
  push:
    branches: [main]
  pull_request:

# bun installs, node runs. The lockfile is bun's, but the tests execute under
# `libuild test -p node`, so the node version below is the one being exercised.
jobs:
  test:
    name: tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm run typecheck
      - run: npm test
      # The published artifact is built, not the source tree, so a build
      # failure has to fail here rather than at publish time.
      - run: npm run build

  eslint-versions:
    # The manifest claims eslint >=9, so both majors get exercised.
    name: eslint ${{ matrix.eslint }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        eslint: ['9', '10']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm install --no-save eslint@${{ matrix.eslint }}
      - run: npm test

  artifact:
    # The tests import src, so a build that produces an unloadable package
    # passes them. It has happened: an import that resolved outside the
    # package survived every test and only failed on install.
    name: built package loads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm run build
      - run: node -e "import('./dist/index.js').then(m => { if (Object.keys(m.default.rules).length !== 1) process.exit(1); })"
